seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 20000
empirical_normalization: false
policy:
  class_name: ActorCritic
  init_noise_std: 1.0
  noise_std_type: scalar
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
algorithm:
  class_name: AMPPPO
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.005
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0
  normalize_advantage_per_mini_batch: false
  symmetry_cfg:
    use_data_augmentation: false
    use_mirror_loss: true
    data_augmentation_func: legged_lab.mdp.symmetryDex:data_augmentation_func_g1
    mirror_loss_coeff: 50.0
  rnd_cfg: null
clip_actions: null
save_interval: 100
experiment_name: dex_run
run_name: v4_run_4096_20000
logger: tensorboard
neptune_project: dex_run
wandb_project: dex_run
resume: false
load_run: .*
load_checkpoint: model_.*.pt
runner_class_name: AmpOnPolicyRunner
amp_reward_coef: 0.3
amp_motion_files:
- legged_lab/envs/dex/datasets/motion_amp_expert/run.txt
amp_num_preload_transitions: 200000
amp_task_reward_lerp: 0.7
